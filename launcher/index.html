<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rex Launcher</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cover" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="M21 16l-5-5-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-perf" viewBox="0 0 24 24"><path d="M4 16a8 8 0 1116 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 16l4-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.8" fill="currentColor"/></symbol>
      <symbol id="i-display" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9.5" y="9.5" width="5" height="5" fill="currentColor"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 001.5.86l12-7.5a1 1 0 000-1.72l-12-7.5A1 1 0 007 4.5z" fill="currentColor"/></symbol>
      <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M6 9h12a4 4 0 014 4v1a4 4 0 01-7 2.6L14.5 15h-5L8 16.6A4 4 0 011 14v-1a4 4 0 014-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11v3M4.5 12.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="12" r="1" fill="currentColor"/><circle cx="18.5" cy="13.5" r="1" fill="currentColor"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="game" role="tab">Game</button>
      <button class="tab" data-tab="settings" role="tab">Pengaturan</button>
    </nav>

    <div class="shortcuts">
      <button class="shortcut" data-action="cover" title="Cover Art"><svg><use href="#i-cover"/></svg><span>Cover</span></button>
      <button class="shortcut" data-action="perf" title="Performa"><svg><use href="#i-perf"/></svg><span>Performa</span></button>
      <button class="shortcut" data-action="display" title="Tampilan"><svg><use href="#i-display"/></svg><span>Tampilan</span></button>
      <button class="shortcut" data-action="hardware" title="Hardware"><svg><use href="#i-chip"/></svg><span>CPU/GPU</span></button>
      <button class="shortcut" data-action="rom" title="Pilih Folder ROM"><svg><use href="#i-folder"/></svg><span>Folder ROM</span></button>
    </div>

    <div class="status">
      <div class="preview" title="Preview layar">
        <div class="preview-screen">
          <div class="preview-half top"></div>
          <div class="preview-half bottom"></div>
        </div>
      </div>
      <div class="clock">
        <span class="clock-time" id="clock-time">--:--</span>
        <span class="clock-date" id="clock-date">---</span>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="view is-active" id="view-game">
      <div class="dashboard">
        <article class="card card-hero" id="card-game"></article>
        <article class="card card-perf" id="card-perf"></article>
        <article class="card card-rom" id="card-rom"></article>
        <article class="card card-credits" id="card-credits"></article>
      </div>
    </section>

    <section class="view" id="view-settings">
      <div class="settings-grid" id="settings-root"></div>
    </section>
  </main>

  <div class="fps-counter" id="fps-counter" hidden>FPS --</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
